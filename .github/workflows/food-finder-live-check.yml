name: Verify Sudo Table clean photo-free UI
on:
  push:
    paths:
      - .github/workflows/food-finder-live-check.yml
      - docs/food-finder/index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check no outdated photo UI and preserve core features
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html=Path('docs/food-finder/index.html').read_text()
          banned=['menu-photos.json','restaurant-photos.json','photo-source-banner','has-menu-photo','data-quick="photos"','viewPhotoSources','PHOTO UPDATE','사진 등록 제안']
          assert not [x for x in banned if x in html], "photo feature still active"
          for marker in ['id="sudoMap"','id="deckSection"','id="cardGrid"','id="visitManage"','id="visitBulkOpen"']:
              assert marker in html, f"core feature missing: {marker}"
          print('SOURCE: no photo UI; map, carousel and shared visits remain')
          PY
      - name: Verify released GitHub Pages HTML
        run: |
          set -euo pipefail
          URL="https://chanwoonghwa.github.io/food-finder/"
          for i in $(seq 1 35); do
            if curl -fsSL --max-time 12 "${URL}?v=no-photo-$(date +%s)" -o /tmp/food-live.html; then
              if grep -Fq 'id="visitBulkOpen"' /tmp/food-live.html &&
                 ! grep -Fq 'photo-source-banner' /tmp/food-live.html &&
                 ! grep -Fq 'menu-photos.json' /tmp/food-live.html; then
                echo 'LIVE CLEAN UI verified'; break
              fi
            fi
            sleep 5
          done
          grep -Fq 'id="sudoMap"' /tmp/food-live.html
          grep -Fq 'id="visitBulkOpen"' /tmp/food-live.html
          ! grep -Fq 'photo-source-banner' /tmp/food-live.html
          ! grep -Fq 'menu-photos.json' /tmp/food-live.html
          echo 'PUBLIC PAGES: photo feature removed and map/visits preserved'
