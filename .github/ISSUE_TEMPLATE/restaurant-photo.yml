name: "📷 실제 매장 메뉴 사진 등록 제안"
description: "사진 권한을 보유한 사람이 직접 제공한 사진을 수도 테이블에 등록하기 위한 검토 요청입니다."
title: "[매장 사진] "
body:
  - type: markdown
    attributes:
      value: |
        수도 테이블의 실제 메뉴 사진은 **직접 촬영했거나 웹사이트 재게시 권한을 받은 사진**만 받습니다.
        네이버지도, 블로그, 리뷰 플랫폼에서 무단으로 내려받은 사진은 등록하지 않습니다.
        제안서 작성만으로 사진이 공개되지는 않으며, 관리자가 검토한 뒤 정적 사이트에 반영합니다.
        **음식·공간 사진 위주**로 부탁드리고, 다른 사람의 얼굴·개인정보가 드러나는 사진은 제출하지 마세요.
  - type: input
    id: restaurant_id
    attributes:
      label: 식당 ID
      description: 수도 테이블에서 확인한 식당 번호
      placeholder: "2"
    validations:
      required: true
  - type: input
    id: restaurant_name
    attributes:
      label: 식당명 및 지점명
      placeholder: "원조닭한마리"
    validations:
      required: true
  - type: dropdown
    id: origin
    attributes:
      label: 사진 출처 및 권한
      options:
        - 직접 촬영한 사진이며 웹사이트 게시를 허락합니다
        - 매장 또는 저작권자가 웹사이트 게시를 명시적으로 허락했습니다
        - 재사용 가능한 공개 라이선스 이미지이며 출처를 제시할 수 있습니다
    validations:
      required: true
  - type: textarea
    id: photos
    attributes:
      label: 메뉴 사진 첨부
      description: 이 입력창에 사진을 드래그하거나 붙여넣어 업로드하세요. 촬영한 대표 메뉴 이름도 적어 주세요.
      placeholder: "예: 닭한마리 2인분 사진, 2026-10-20 촬영"
    validations:
      required: true
  - type: textarea
    id: rights_proof
    attributes:
      label: 촬영자 · 허가 근거 · 표기할 출처
      description: 직접 촬영자는 표기할 이름, 타인 제공 사진이면 권한자와 허가 방식·허용 범위를 기재해 주세요.
      placeholder: "예: 직접 촬영 / 사진 제공: 홍길동 / 수도 테이블 게시·썸네일 자르기 허용"
    validations:
      required: true
  - type: checkboxes
    id: attest
    attributes:
      label: 제출 확인
      options:
        - label: "해당 사진을 제출하고 수도 테이블에 게시할 적법한 권한이 있음을 확인합니다."
          required: true
        - label: "인물 식별정보와 개인정보가 없는 사진이며, 사이트용 썸네일 편집·크롭 가능 여부를 기재했습니다."
          required: true
