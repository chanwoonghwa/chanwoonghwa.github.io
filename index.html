<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chanwoong Hwa · Resume</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f1f0ec;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:#e6f0fc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#006300;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#16263a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good:#0ca30c;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#16263a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;
  line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--ring)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-weight:800;letter-spacing:-.02em;flex:none}
header.top nav{display:flex;gap:18px;flex:1;overflow-x:auto;scrollbar-width:none;padding-left:8px}
header.top nav a{color:var(--ink-2);text-decoration:none;font-size:14px;white-space:nowrap}
header.top nav a:hover{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:999px;overflow:hidden;flex:none}
.seg button{background:none;border:0;color:var(--ink-2);padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.iconbtn{background:none;border:1px solid var(--ring);border-radius:999px;color:var(--ink-2);width:32px;height:32px;cursor:pointer;flex:none;font-size:15px}
.hero{padding:56px 0 8px}
.hero .name{font-size:clamp(40px,8vw,64px);font-weight:800;letter-spacing:-.035em;line-height:1;margin:0}
.hero .role{font-size:clamp(16px,2.4vw,20px);color:var(--ink-2);margin:12px 0 0;font-weight:500}
.hero .role b{color:var(--ink);font-weight:700}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0 0}
.pillar{background:var(--surface);border:1px solid var(--ring);border-radius:16px;padding:18px}
.pillar .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);margin-bottom:10px}
.pillar h3{margin:0 0 4px;font-size:16px}
.pillar p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(6,1fr);margin:28px 0 0;background:var(--surface);border:1px solid var(--ring);border-radius:16px;overflow:hidden}
.stat{padding:16px 14px;border-right:1px solid var(--grid)}
.stat:last-child{border-right:0}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .v small{font-size:13px;font-weight:600;color:var(--ink-2);margin-left:2px}
.stat .k{color:var(--ink-2);font-size:12.5px;margin-top:4px;line-height:1.35}
.note{color:var(--muted);font-size:12px;margin-top:8px}
section{padding:56px 0 0}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.sh h2{font-size:24px;margin:0;letter-spacing:-.02em}
.sh span{color:var(--muted);font-size:14px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch}
.step{position:relative;background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:16px 14px;margin-right:22px}
.step:last-child{margin-right:0;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.step:not(:last-child)::after{content:"";position:absolute;right:-17px;top:50%;width:10px;height:10px;border-top:2px solid var(--axis);border-right:2px solid var(--axis);transform:translateY(-50%) rotate(45deg)}
.step .n{font-size:12px;color:var(--muted);font-weight:600}
.step .big{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.step .d{font-size:13px;color:var(--ink-2);line-height:1.45}
.ba{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.bacard{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:16px}
.bacard .t{font-size:13px;color:var(--ink-2);margin-bottom:10px;min-height:2.7em;line-height:1.35}
.bacard .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bacard .before{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;font-size:15px}
.bacard .arrow{color:var(--muted)}
.bacard .after{font-size:24px;font-weight:800;letter-spacing:-.02em}
.bacard .x{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--ring);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:16px;overflow:hidden}
.card.hide{display:none}
.card>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:40px 1fr auto 18px;gap:14px;align-items:center;width:100%;padding:16px 18px;cursor:pointer}
.card>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rank{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;color:var(--ink-2);font-size:14px}
.card.top3 .rank{background:var(--accent);color:#fff}
.card .ttl{font-weight:700;font-size:16.5px;letter-spacing:-.01em;line-height:1.35}
.card .hl{color:var(--ink-2);font-size:14px;margin-top:2px;line-height:1.45}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:1px 7px}
.tag.on{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.metric{text-align:right;white-space:nowrap}
.metric b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}
.metric span{font-size:11.5px;color:var(--muted)}
.chev{color:var(--muted);transition:transform .2s;font-size:18px}
.card.open .chev{transform:rotate(90deg)}
.body{display:none;padding:0 18px 18px 72px;color:var(--ink-2);font-size:14.5px}
.card.open .body{display:block}
.body ul{margin:0;padding-left:18px}
.body li{margin:5px 0}
.body .techttl{font-size:12px;font-weight:700;color:var(--accent-ink);margin:0 0 6px;letter-spacing:.01em}
.body li.lead{list-style:none;margin-left:-18px;color:var(--ink)}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.qc{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:14px 16px}
.qc .q{font-size:13px;font-weight:800;color:var(--accent-ink);letter-spacing:.02em}
.qc ul{margin:8px 0 0;padding:0;list-style:none}
.qc li{font-size:13.5px;line-height:1.45;padding:6px 0;border-top:1px solid var(--grid)}
.qc li:first-child{border-top:0}
.qc li em{font-style:normal;font-weight:700;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--surface);border:1px solid var(--ring);border-radius:16px;padding:16px;position:relative}
.panel h3{font-size:15px;margin:0}
.panel .cap{color:var(--ink-2);font-size:13px;margin:2px 0 10px;padding-right:70px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
svg .val{fill:var(--ink);font-size:12px;font-weight:700}
.tablebtn{position:absolute;top:12px;right:12px;font-size:12px;background:none;border:1px solid var(--ring);border-radius:8px;color:var(--ink-2);padding:2px 8px;cursor:pointer}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;display:none}
table.dt th,table.dt td{border-bottom:1px solid var(--grid);padding:4px 6px;text-align:right}
table.dt th:first-child,table.dt td:first-child{text-align:left}
.panel.tab table.dt{display:table}
.panel.tab svg,.panel.tab .legend{display:none}
#tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--ring);box-shadow:0 6px 24px rgba(0,0,0,.12);border-radius:10px;padding:8px 10px;font-size:12px;opacity:0;transition:opacity .1s;z-index:50;min-width:140px}
#tip .h{color:var(--ink-2);margin-bottom:4px}
#tip .r{display:flex;align-items:center;gap:10px;justify-content:space-between}
#tip .r b{color:var(--ink)}
#tip .r span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
#tip .r i{width:12px;height:2px;display:inline-block}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.skill h3{font-size:15px;margin:0 0 2px}
.skill .en{font-size:12px;color:var(--muted);margin-bottom:8px}
.skill ul{margin:0;padding-left:16px;color:var(--ink-2);font-size:13.5px}
.skill li{margin:5px 0;line-height:1.45}
footer{padding:48px 0 64px;color:var(--muted);font-size:12px}
@media (max-width:900px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat:nth-child(3n){border-right:0}
  .stat:nth-child(-n+3){border-bottom:1px solid var(--grid)}
  .ba{grid-template-columns:repeat(2,1fr)}
  .tl,.skills{grid-template-columns:repeat(2,1fr)}
  .flow{grid-template-columns:1fr;gap:18px}
  .step{margin-right:0}
  .step:not(:last-child)::after{right:auto;left:24px;top:auto;bottom:-14px;transform:rotate(135deg)}
}
@media (max-width:640px){
  .pillars,.grid2,.skills,.tl{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat,.stat:nth-child(3n){border-right:1px solid var(--grid);border-bottom:1px solid var(--grid)}
  .stat:nth-child(2n){border-right:0}
  .stat:nth-last-child(-n+2){border-bottom:0}
  .card>button{grid-template-columns:34px 1fr 18px;gap:12px;padding:14px}
  .metric{grid-column:2;grid-row:2;text-align:left}
  .metric b{display:inline;font-size:15px;margin-right:6px}
  .chev{grid-column:3;grid-row:1}
  .body{padding:0 14px 16px 14px}
  header.top .brand{display:none}
}
@media print{
  header.top,.chips,.tablebtn,.iconbtn{display:none}
  .card .body,.card.hide{display:block}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Chanwoong Hwa</div>
  <nav aria-label="sections">
    <a href="#impact" data-i18n="nav_imp"></a>
    <a href="#exp" data-i18n="nav_exp"></a>
    <a href="#timeline" data-i18n="nav_tl"></a>
    <a href="#numbers" data-i18n="nav_num"></a>
    <a href="#skills" data-i18n="nav_sk"></a>
  </nav>
  <div class="seg" role="group" aria-label="language"><button data-lang="KR">KR</button><button data-lang="EN">EN</button></div>
  <button class="iconbtn" id="themeBtn" aria-label="theme">◐</button>
</div></header>

<main class="wrap">
  <div class="hero">
    <h1 class="name">Chanwoong Hwa</h1>
    <p class="role" id="role"></p>
    <div class="pillars" id="pillars"></div>
    <div class="stats" id="stats"></div>
    <div class="note" data-i18n="statnote"></div>
  </div>

  <section id="impact">
    <div class="sh"><h2 data-i18n="imp_h"></h2><span data-i18n="imp_sub"></span></div>
    <div class="flow" id="flow"></div>
    <div class="ba" id="ba"></div>
  </section>

  <section id="exp">
    <div class="sh"><h2 data-i18n="exp_h"></h2><span data-i18n="exp_sub"></span></div>
    <div class="chips" id="chips" role="group" aria-label="filter"></div>
    <div class="cards" id="cards"></div>
  </section>

  <section id="timeline">
    <div class="sh"><h2 data-i18n="tl_h"></h2><span data-i18n="tl_sub"></span></div>
    <div class="tl" id="tl"></div>
  </section>

  <section id="numbers">
    <div class="sh"><h2 data-i18n="num_h"></h2><span data-i18n="num_sub"></span></div>
    <div class="grid2">
      <div class="panel">
        <h3 data-i18n="pr_h"></h3><p class="cap" data-i18n="pr_cap"></p>
        <button class="tablebtn"></button>
        <div class="legend" id="lg-pr"></div>
        <svg id="c-pr" role="img"></svg><table class="dt" id="t-pr"></table>
      </div>
      <div class="panel">
        <h3 data-i18n="rv_h"></h3><p class="cap" data-i18n="rv_cap"></p>
        <button class="tablebtn"></button>
        <div class="legend" id="lg-rv"></div>
        <svg id="c-rv" role="img"></svg><table class="dt" id="t-rv"></table>
      </div>
    </div>
  </section>

  <section id="skills">
    <div class="sh"><h2 data-i18n="sk_h"></h2><span data-i18n="sk_sub"></span></div>
    <div class="skills" id="sk"></div>
  </section>

  <footer data-i18n="foot"></footer>
</main>
<div id="tip" role="tooltip"></div>

<script>
const DATA = {"items": [{"n": 1, "kr": "매일 돌아가는 자동 재분석으로 새 진단 찾기", "en": "Daily automated reanalysis that finds new diagnoses", "tk": "자동 재분석 파이프라인", "te": "Automated Reanalysis Pipeline", "ongoing": true, "KR": [{"d": 0, "t": "3.8만 샘플을 매일 최신 지식으로 다시 분석하고, 데이터 수집을 26배 빠르게 만듦."}, {"d": 1, "t": "일 약 38,000 샘플 규모의 자동 재분석 파이프라인을 운영·고도화함."}, {"d": 2, "t": "대상을 WES에서 WGS로 확장하고, SNV·CNV 재분석을 함께 운영함."}, {"d": 2, "t": "후보 선별 기준을 증상유사도에서 3ASC 점수로 전환함."}, {"d": 1, "t": "결과 관리를 스프레드시트에서 임상 플랫폼(GEBRA) UI·DB로 이전하는 작업에 참여함."}, {"d": 1, "t": "샘플 수집·잡 제출을 레거시 오케스트레이터에서 분리하고, 다른 변이 타입으로도 확장 가능한 병렬 I/O 구조로 재설계함."}, {"d": 2, "t": "후보 수집 시간: 78분 → 3분 (약 26배)"}, {"d": 2, "t": "후보 키 생성 병목: 5분 → 12초"}, {"d": 1, "t": "중단돼 있던 CNV 재분석을 변이 단위 구조로 재구축해 서비스를 재개하고, 일 후보 수를 약 7만 건에서 약 1만 건으로 줄여 판독 부담을 낮춤."}, {"d": 1, "t": "누락 샘플 전수조사와 레거시 데이터 1,100여 건 복구로 재분석 커버리지를 확보함. 이 파이프라인을 통한 누적 신규 진단은 1,400명 이상(회사 공개 기준)임."}], "EN": [{"d": 0, "t": "Re-analyzes ~38K samples daily against the latest knowledge; data collection made 26× faster."}, {"d": 1, "t": "Operate and extend a ~38K-sample/day automated reanalysis pipeline."}, {"d": 2, "t": "Extended coverage from WES to WGS, running reanalysis for both SNVs and CNVs."}, {"d": 2, "t": "Switched candidate selection from symptom similarity to 3ASC scores."}, {"d": 1, "t": "Contributed to moving result management from spreadsheets into the clinical platform's (GEBRA) UI and database."}, {"d": 1, "t": "Decoupled sample collection and job submission from the legacy orchestrator and rebuilt them around a parallel-I/O design that can extend to other variant types: candidate collection dropped from 78 to 3 minutes (~26×), and key generation from 5 minutes to 12 seconds."}, {"d": 1, "t": "Rebuilt the stalled CNV reanalysis around a per-variant model and brought it back into service, cutting daily candidates from ~70K to ~10K to ease clinical review."}, {"d": 1, "t": "Recovered coverage through a missing-sample audit and restoration of ~1.1K legacy results. The pipeline has contributed to 1,400+ new diagnoses (company-published figure)."}]}, {"n": 2, "kr": "AI 변이 우선순위 시스템 재구축 리드", "en": "Leading the rebuild of an AI variant-prioritization system", "tk": "3ASC 재구축 및 BI 이관 리드", "te": "3ASC Rebuild & Ownership Transfer", "ongoing": true, "KR": [{"d": 0, "t": "AI팀에서 시스템을 넘겨받아 학습 데이터 파이프라인을 새로 설계·구축함."}, {"d": 1, "t": "AI 변이 우선순위 시스템 **3ASC**에서 모델을 제외한 데이터 빌드부터 서빙까지 전 영역을 AI팀에서 이관받음."}, {"d": 2, "t": "이해관계자 회의를 주관하며 아키텍처와 전 변이 타입 feature·interface 명세를 합의함."}, {"d": 2, "t": "학습 데이터 시점 정책(판독 시점 고정, 데이터 누수 방지)을 수립함."}, {"d": 1, "t": "신규 파이프라인 레포를 구축함."}, {"d": 2, "t": "SNV·CNV·Sample 약 70개 테이블 정규화를 직접 구현하고, 7개 변이 타입 공통 스키마를 정합함."}, {"d": 2, "t": "설계 근거는 약 160만 파일 전수조사로 확보함."}, {"d": 1, "t": "AI팀에 mock 데이터를 선제공해 병렬 개발을 가능하게 함."}, {"d": 1, "t": "CNV·SV 벤치마크 데이터(586·178샘플)를 생산함."}, {"d": 1, "t": "기존 모델은 학습 데이터 결함을 진단하고 재학습 배포를 지원함."}], "EN": [{"d": 0, "t": "Took the system over from the AI team and redesigned its training-data pipeline."}, {"d": 1, "t": "Took over the 3ASC (AI variant prioritization) data-build-through-serving stack from the AI team."}, {"d": 2, "t": "Chaired stakeholder sessions to agree on the architecture and the feature/interface specs for every variant type."}, {"d": 2, "t": "Set a leakage-safe training-data policy that fixes data at report time."}, {"d": 1, "t": "Stood up a new pipeline repo and implemented ~70 normalized tables (SNV/CNV/sample) under a shared 7-variant-type schema, grounding the schema in a survey of ~1.6M output files."}, {"d": 1, "t": "Shipped mock data early so the AI team could develop in parallel, and produced CNV/SV benchmark sets (586 and 178 samples)."}, {"d": 1, "t": "Diagnosed a training-data defect in the existing model and supported its retraining and release."}]}, {"n": 3, "kr": "변이 병원성 판정 정확도 개선", "en": "More accurate variant pathogenicity calls", "tk": "ACMG 분류 정확도 개선", "te": "ACMG Classification Accuracy", "ongoing": false, "KR": [{"d": 0, "t": "국제 기준(ACMG) 판정을 점수 기반으로 전환하고 과대·과소 판정 오류를 교정함."}, {"d": 1, "t": "point-based 분류 체계 전환에 참여함. PS4 assigner를 신규 구현하고, PM2/BA1/BS1 판정 로직을 전면 개편함."}, {"d": 1, "t": "CNV 규칙 동시부여로 생긴 과대평가는 충돌 해소 로직으로, 과소평가는 인구빈도 cutoff로 교정함."}, {"d": 1, "t": "다중 유전자 변이에서 이웃 유전자의 cutoff가 잘못 적용되던 캐시 결함을 수정하고, 영향 범위를 전수조사함."}, {"d": 1, "t": "MANE 기반 대표 transcript 매핑을 적용하고, 전 변이 타입에 2차 소견 표기를 추가함."}], "EN": [{"d": 0, "t": "Moved guideline-based (ACMG) calls to a point system and fixed over- and under-calls."}, {"d": 1, "t": "Contributed to the point-based ACMG transition: implemented a new PS4 assigner and overhauled the PM2/BA1/BS1 logic."}, {"d": 1, "t": "Corrected CNV over-calls from co-assigned rules with conflict resolution, and under-calls with population-frequency cutoffs."}, {"d": 1, "t": "Fixed a caching defect that applied a neighboring gene's cutoffs to multi-gene variants, and ran a full impact survey."}, {"d": 1, "t": "Aligned outputs to MANE representative transcripts and added secondary-finding flags for every variant type."}]}, {"n": 4, "kr": "판정 로직 자동 검증과 배포 안전장치", "en": "Automated checks and release safeguards", "tk": "검증·품질 게이트 체계", "te": "Validation & Quality-Gate System", "ongoing": true, "KR": [{"d": 0, "t": "모든 판정 규칙을 자동 테스트하고, 실제 진단 사례로 배포 전 이상을 감지함."}, {"d": 1, "t": "단일 \"정답지\"에 의존해 유지보수가 어렵던 검증 체계를 재설계함."}, {"d": 2, "t": "전 변이 타입 ACMG functional test(시나리오 기반)를 구축함."}, {"d": 2, "t": "validator는 E2E smoke로 축소함."}, {"d": 2, "t": "검증 데이터는 버전관리로 이전함."}, {"d": 1, "t": "레포 전체 테스트 커버리지 90%를 달성해 CI에서 강제하고, 이 과정에서 숨은 결함 10건을 발견함."}, {"d": 1, "t": "실제 진단 기록에서 판정이 안정적인 변이 812개를 선별해 배포 전 회귀 게이트를 구축 중임."}], "EN": [{"d": 0, "t": "Every rule is tested automatically, and real diagnosed cases catch regressions before release."}, {"d": 1, "t": "Re-architected a hard-to-maintain single-truth validator:"}, {"d": 2, "t": "built scenario-based ACMG functional tests for every variant type,"}, {"d": 2, "t": "reduced the validator to an E2E smoke check,"}, {"d": 2, "t": "moved validation data under version control."}, {"d": 1, "t": "Raised repo-wide test coverage to 90% and enforced it in CI, surfacing 10 latent defects along the way."}, {"d": 1, "t": "Building a pre-deployment regression gate on 812 diagnostically stable variants drawn from real case history."}]}, {"n": 5, "kr": "분석 서버 용량 산정과 서비스 분산", "en": "Server capacity planning and service separation", "tk": "HPC·인프라 현대화", "te": "HPC & Infrastructure Modernization", "ongoing": true, "KR": [{"d": 0, "t": "처리량 데이터로 증설 규모를 정하고, 한 서버에 몰린 서비스 20개를 나눠 장애 위험을 없앰."}, {"d": 1, "t": "로그 기반 slot-hour 모델로 재분석 클러스터의 처리량과 가동률을 정량화함(가동률 약 75.6%, WGS 비용은 WES의 약 12.6배). 이를 근거로 필요한 노드 증설 규모(5→9노드)를 산출해 증설 의사결정을 지원함."}, {"d": 1, "t": "단일 서버에 혼재되어 있던 임상 웹서비스·파이프라인·DB 작업 20여 개를 운영용 VM 4대로 분산 이전해 단일 장애점을 제거함."}, {"d": 2, "t": "1주간 프로세스 메모리를 실측해 측정 허수(797G)와 실제 원인을 규명하고, 이를 근거로 VM 사양을 산정함."}, {"d": 2, "t": "6개 팀과 이전 일정을 조율함."}, {"d": 1, "t": "Slurm 제출 경로(sbatch·REST)를 구현함."}], "EN": [{"d": 0, "t": "Sized expansion from throughput data and split 20 services off one server to remove a single point of failure."}, {"d": 1, "t": "Quantified reanalysis cluster throughput with a log-based slot-hour model (~75.6% utilization; WGS ≈ 12.6× WES cost) and used it to size a 5→9 node expansion."}, {"d": 1, "t": "Migrated 20+ clinical web services, pipelines, and DB jobs off a single shared server onto 4 operational VMs, removing a single point of failure."}, {"d": 2, "t": "Sized the VMs from a week of process-memory profiling, which exposed a 797G reading as a measurement artifact and identified the actual cause."}, {"d": 2, "t": "Coordinated the cutover across six teams."}, {"d": 1, "t": "Implemented sbatch and REST (slurmrestd) submission paths for Slurm."}]}, {"n": 6, "kr": "대용량 유전체 DB 조회 속도 개선", "en": "Faster lookups in large genomic databases", "tk": "EVIDENCE 어노테이션 엔진 성능 개선", "te": "EVIDENCE Annotation Engine Performance", "ongoing": false, "KR": [{"d": 0, "t": "필요한 부분만 읽도록 바꿔 조회 시간을 1분에서 1–2초로 단축함."}, {"d": 1, "t": "약 350만 건 규모 ClinVar 등 대용량 DB를 전체 스캔하던 어노테이션을 재설   {q:"2026 Q3",KR:["<em>AI 학습 데이터 파이프라인 구축</em>","테스트 커버리지 90% 품질 게이트","서버 서비스 20개를 VM으로 분산 이전"],EN:["<em>Built the AI training-data pipeline</em>","90% test-coverage quality gate","Moved 20 server services onto separate VMs"]}
];
const Q = ["24Q4","25Q1","25Q2","25Q3","25Q4","26Q1","26Q2","26Q3"];
const PR = [
  {id:"s1",name:{KR:"EVIDENCE 엔진",EN:"EVIDENCE engine"},v:[8,29,52,55,55,78,62,35]},
  {id:"s2",name:{KR:"3ASC",EN:"3ASC"},v:[0,0,0,2,4,6,11,63]},
  {id:"s3",name:{KR:"공용 라이브러리",EN:"Shared library"},v:[0,0,6,5,1,1,2,1]}
];
const RV = [1,17,34,78,67,108,89,107];

let LANG="KR", FILTER="all";
try{ LANG=localStorage.getItem("cv-lang")||"KR"; }catch(e){}
const $=s=>document.querySelector(s);
const el=(tag,attrs={},text)=>{const e=document.createElement(tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e;};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS="http://www.w3.org/2000/svg", sv=(tag,a={})=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e;};
const L=o=>o[LANG];
const strip=s=>s.replace(/\*\*/g,"");

function applyI18n(){
  document.documentElement.lang=LANG==="KR"?"ko":"en";
  document.querySelectorAll("[data-i18n]").forEach(n=>{const v=T[LANG][n.dataset.i18n]; if(v!=null) n.textContent=v;});
  $("#role").innerHTML=T[LANG].role; // static, trusted string
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===LANG)));
  document.querySelectorAll(".tablebtn").forEach(b=>b.textContent=b.closest(".panel").classList.contains("tab")?T[LANG].chart:T[LANG].table);
}
function renderHero(){
  const p=$("#pillars"); p.textContent="";
  PILLARS.forEach(x=>{const d=el("div",{class:"pillar"}), ic=el("div",{class:"ic","aria-hidden":"true"}); ic.innerHTML=ICONS[x.ic];
    d.append(ic, el("h3",{},x[LANG][0]), el("p",{},x[LANG][1])); p.appendChild(d);});
  const s=$("#stats"); s.textContent="";
  STATS.forEach(x=>{const d=el("div",{class:"stat"}), v=el("div",{class:"v"},x.v); if(x.u[LANG]) v.appendChild(el("small",{},x.u[LANG]));
    d.append(v, el("div",{class:"k"},x.k[LANG])); s.appendChild(d);});
}
function renderImpact(){
  const f=$("#flow"); f.textContent="";
  FLOW.forEach(x=>{const d=el("div",{class:"step"}); d.append(el("div",{class:"n"},L(x.n)), el("div",{class:"big"},x.big), el("div",{class:"d"},L(x.d))); f.appendChild(d);});
  const b=$("#ba"); b.textContent="";
  BA.forEach(x=>{const d=el("div",{class:"bacard"}); d.appendChild(el("div",{class:"t"},L(x.t)));
    const r=el("div",{class:"row"}); r.append(el("span",{class:"before"},L(x.b)), el("span",{class:"arrow","aria-hidden":"true"},"→"), el("span",{class:"after"},L(x.a)));
    d.append(r, el("span",{class:"x"},L(x.x))); b.appendChild(d);});
}
function renderChips(){
  const box=$("#chips"); box.textContent="";
  const mk=(id,label)=>{const b=el("button",{class:"chip","aria-pressed":String(FILTER===id)},label); b.onclick=()=>{FILTER=id;renderChips();applyFilter();}; box.appendChild(b);};
  mk("all",T[LANG].all); Object.keys(THEMES).forEach(k=>mk(k,THEMES[k][LANG]));
}
function applyFilter(){ document.querySelectorAll(".card").forEach(c=>c.classList.toggle("hide",FILTER!=="all"&&!c.dataset.t.split(",").includes(FILTER))); }
function renderCards(){
  const box=$("#cards"), open=new Set([...document.querySelectorAll(".card.open")].map(c=>c.dataset.n)); box.textContent="";
  DATA.items.forEach(it=>{
    const m=META[it.n], c=el("article",{class:"card"+(it.n<=3?" top3":""),"data-n":it.n,"data-t":m.t.join(",")}); if(open.has(String(it.n))) c.classList.add("open");
    const id="b"+it.n, btn=el("button",{"aria-expanded":String(c.classList.contains("open")),"aria-controls":id});
    const mid=el("div"); mid.append(el("div",{class:"ttl"},LANG==="KR"?it.kr:it.en), el("div",{class:"hl"},strip(it[LANG][0].t)));
    const tags=el("div",{class:"tags"}); m.t.forEach(t=>tags.appendChild(el("span",{class:"tag"},THEMES[t][LANG])));
    if(it.ongoing) tags.appendChild(el("span",{class:"tag on"},"● "+T[LANG].ongoing)); mid.appendChild(tags);
    const met=el("div",{class:"metric"}); met.append(el("b",{},m.m.v[LANG]), el("span",{},m.m.k[LANG]));
    btn.append(el("div",{class:"rank"},String(it.n)), mid, met, el("span",{class:"chev","aria-hidden":"true"},"›"));
    btn.onclick=()=>{c.classList.toggle("open"); btn.setAttribute("aria-expanded",String(c.classList.contains("open")));};
    const body=el("div",{class:"body",id}), ul=el("ul");
    body.appendChild(el("div",{class:"techttl"},(LANG==="KR"?"기술 상세 · ":"Technical detail · ")+(LANG==="KR"?it.tk:it.te)));
    it[LANG].slice(1).forEach(p=>{const li=el("li",{},strip(p.t)); if(p.d===0) li.className="lead"; else if(p.d>1) li.style.marginLeft=((p.d-1)*18)+"px"; ul.appendChild(li);});
    body.appendChild(ul); c.append(btn,body); box.appendChild(c);
  });
  applyFilter();
}
function renderTL(){
  const box=$("#tl"); box.textContent="";
  TL.forEach(t=>{const d=el("div",{class:"qc"}); d.appendChild(el("div",{class:"q"},t.q));
    const ul=el("ul"); t[LANG].forEach(x=>{const li=el("li"); li.innerHTML=x; ul.appendChild(li);}); // static, trusted strings
    d.appendChild(ul); box.appendChild(d);});
}
function renderSkills(){
  const box=$("#sk"); box.textContent="";
  DATA.skills.forEach(s=>{const d=el("div",{class:"panel skill"});
    d.append(el("h3",{},LANG==="KR"?s.kr:s.en), el("div",{class:"en"},LANG==="KR"?s.en:s.kr));
    const ul=el("ul"); s.items.forEach(x=>ul.appendChild(el("li",{},x))); d.appendChild(ul); box.appendChild(d);});
}
const tip=$("#tip");
function showTip(evt,head,rows){
  tip.textContent=""; tip.appendChild(el("div",{class:"h"},head));
  rows.forEach(r=>{const row=el("div",{class:"r"}),s=el("span"); if(r.c){const i=el("i"); i.style.background=r.c; s.appendChild(i);} s.appendChild(document.createTextNode(r.k)); row.append(s,el("b",{},r.v)); tip.appendChild(row);});
  const rect=evt.target.getBoundingClientRect(), x=evt.clientX??rect.left+20, y=evt.clientY??rect.top;
  const w=tip.offsetWidth||160; tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x+14))+"px"; tip.style.top=(y-10)+"px"; tip.style.opacity=1;
}
const hideTip=()=>{tip.style.opacity=0;};
function sizeOf(svg,h){const w=Math.max(240,svg.parentElement.clientWidth-32); svg.setAttribute("viewBox",`0 0 ${w} ${h}`); svg.setAttribute("width",w); svg.setAttribute("height",h); return w;}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(m*p>=v) return m*p; return 10*p;}
function roundTop(x,y,w,h,r){r=Math.min(r,h,w/2); return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;}
function barChart(svgSel,tableSel,series,legendSel){
  const svg=$(svgSel); svg.textContent=""; const H=220, W=sizeOf(svg,H), pad={l:30,r:6,t:16,b:22};
  const tot=Q.map((_,i)=>series.reduce((a,s)=>a+s.v[i],0)), max=niceMax(Math.max(...tot)), sy=v=>(H-pad.t-pad.b)*v/max;
  for(let i=0;i<=4;i++){const y=H-pad.b-(H-pad.t-pad.b)*i/4; svg.appendChild(sv("line",{x1:pad.l,x2:W-pad.r,y1:y,y2:y,stroke:i?css("--grid"):css("--axis")}));
    const t=sv("text",{x:pad.l-6,y:y+4,"text-anchor":"end"}); t.textContent=Math.round(max*i/4); svg.appendChild(t);}
  const bw=(W-pad.l-pad.r)/Q.length, inner=Math.min(30,bw*0.6);
  Q.forEach((q,i)=>{
    const x=pad.l+bw*i+(bw-inner)/2, g=sv("g",{tabindex:0,role:"img","aria-label":`${q} ${tot[i]}`}); let y=H-pad.b;
    const vis=series.filter(s=>s.v[i]>0);
    vis.forEach((s,j)=>{const h=sy(s.v[i]), gap=j>0?2:0; y-=h; const hh=Math.max(0,h-gap);
      g.appendChild(sv("path",{d:j===vis.length-1?roundTop(x,y,inner,hh,4):`M${x},${y}h${inner}v${hh}h${-inner}Z`,fill:css("--"+s.id)}));});
    g.appendChild(sv("rect",{x:pad.l+bw*i,y:pad.t,width:bw,height:H-pad.t-pad.b,fill:"transparent"}));
    const rows=()=>series.length>1?[...series.map(s=>({k:s.name[LANG],v:String(s.v[i]),c:css("--"+s.id)})),{k:T[LANG].total,v:String(tot[i])}]:[{k:series[0].name[LANG],v:String(tot[i]),c:css("--"+series[0].id)}];
    g.addEventListener("pointermove",e=>{g.style.opacity=.85;showTip(e,q,rows());});
    g.addEventListener("pointerleave",e=>{g.style.opacity=1;if(e.pointerType!=="touch")hideTip();});
    g.addEventListener("focus",e=>showTip(e,q,rows())); g.addEventListener("blur",hideTip);
    svg.appendChild(g);
    const t=sv("text",{x:pad.l+bw*i+bw/2,y:H-6,"text-anchor":"middle"}); t.textContent=q; svg.appendChild(t);
  });
  const pk=tot.indexOf(Math.max(...tot)), lab=sv("text",{class:"val",x:pad.l+bw*pk+bw/2,y:H-pad.b-sy(tot[pk])-5,"text-anchor":"middle"}); lab.textContent=tot[pk]; svg.appendChild(lab);
  const lg=$(legendSel); lg.textContent=""; if(series.length>1) series.forEach(s=>{const sp=el("span"),i=el("i"); i.style.background=css("--"+s.id); sp.append(i,document.createTextNode(s.name[LANG])); lg.appendChild(sp);});
  const tb=$(tableSel); tb.textContent=""; const hr=el("tr"); hr.appendChild(el("th",{},T[LANG].quarter)); series.forEach(s=>hr.appendChild(el("th",{},s.name[LANG]))); if(series.length>1) hr.appendChild(el("th",{},T[LANG].total)); tb.appendChild(hr);
  Q.forEach((q,i)=>{const r=el("tr"); r.appendChild(el("td",{},q)); series.forEach(s=>r.appendChild(el("td",{},String(s.v[i])))); if(series.length>1) r.appendChild(el("td",{},String(tot[i]))); tb.appendChild(r);});
}
function drawCharts(){ barChart("#c-pr","#t-pr",PR,"#lg-pr"); barChart("#c-rv","#t-rv",[{id:"s1",name:{KR:T.KR.reviews,EN:T.EN.reviews},v:RV}],"#lg-rv"); }
function renderAll(){ applyI18n(); renderHero(); renderImpact(); renderChips(); renderCards(); renderTL(); renderSkills(); drawCharts(); }

document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang; try{localStorage.setItem("cv-lang",LANG);}catch(e){} renderAll();});
document.querySelectorAll(".tablebtn").forEach(b=>b.onclick=()=>{const p=b.closest(".panel"); p.classList.toggle("tab"); b.textContent=p.classList.contains("tab")?T[LANG].chart:T[LANG].table;});
$("#themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",next); try{localStorage.setItem("cv-theme",next);}catch(e){} drawCharts();};
try{const th=localStorage.getItem("cv-theme"); if(th) document.documentElement.setAttribute("data-theme",th);}catch(e){}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",drawCharts);
document.addEventListener("pointerdown",e=>{if(!e.target.closest("svg")) hideTip();});
addEventListener("scroll",hideTip,{passive:true});
let rt; addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(drawCharts,120);});
renderAll();
</script>
